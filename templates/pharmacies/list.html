{% extends 'base/base.html' %}
{% block title %}Pharmacies{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Verified Pharmacies</h2>
    <div class="row">
        {% for pharmacy in pharmacies %}
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ pharmacy.name }}</h5>
                    <p class="card-text">{{ pharmacy.address }}</p>
                    <p class="card-text">{{ pharmacy.phone }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
